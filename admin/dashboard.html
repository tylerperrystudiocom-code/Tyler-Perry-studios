<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Secure Admin Portal — Tyler Perry</title>
  <link rel="stylesheet" href="../public/css/style.css" />
  
  <style>
    /* Hide scrollbars for a clean mobile preview */
    ::-webkit-scrollbar { display: none; }
    html, body { -ms-overflow-style: none; scrollbar-width: none; }

    body.dashboard { background: #080808; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }

    /* --- LOGIN GATE --- */
    .login-gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1712, #080808 60%);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #121212;
      border: 1px solid #C9A45C;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(228, 201, 138, 0.1);
      text-align: center;
    }
    .login-card h1 { color: #E4C98A; font-size: 2rem; margin-top: 0; margin-bottom: 10px; letter-spacing: 2px; }
    .login-card p { color: #B8B8B8; font-size: 0.9rem; margin-bottom: 30px; }
    .login-card label { display: block; text-align: left; color: #E4C98A; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-top: 20px; }
    .login-card input {
      width: 100%;
      padding: 15px;
      background: #080808;
      border: 1px solid #292929;
      border-radius: 6px;
      color: white;
      font-size: 1.5rem; /* Larger font for passcode */
      text-align: center;
      letter-spacing: 10px; /* Space out numbers */
      transition: 0.3s;
      box-sizing: border-box;
    }
    .login-card input:focus { outline: none; border-color: #C9A45C; box-shadow: 0 0 10px rgba(201, 164, 92, 0.2); }
    .login-card button { width: 100%; margin-top: 30px; padding: 16px; font-size: 1rem; font-weight: bold; letter-spacing: 1px; }
    .error-msg { color: #F44336; font-size: 0.9rem; margin-top: 15px; display: none; }

    /* --- DASHBOARD LAYOUT --- */
    .dash-shell { display: flex; min-height: 100vh; }
    .dash-side { width: 250px; background: #0f0f0f; border-right: 1px solid #292929; padding: 24px 0; display: flex; flex-direction: column; }
    .dash-side a { display: block; padding: 12px 24px; color: #B8B8B8; font-size: 0.9rem; text-decoration: none; transition: 0.3s; border: none; background: none; text-align: left; cursor: pointer; }
    .dash-side a:hover, .dash-side a.active { color: #E4C98A; background: #151515; border-left: 3px solid #C9A45C; }
    .dash-main { flex: 1; padding: 40px; }
    .dash-main h1 { font-size: 1.8rem; margin-top: 0; color: #E4C98A; }

    /* --- PAYMENT CARDS --- */
    .payment-card { background: #121212; border: 1px solid #292929; padding: 20px; border-radius: 6px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
    .payment-info { flex: 1; min-width: 250px; }
    .payment-info h3 { margin: 0 0 8px; color: #E4C98A; font-size: 1.2rem; }
    .payment-info p { margin: 4px 0; color: #B8B8B8; font-size: 0.9rem; }
    .payment-img { max-width: 150px; border-radius: 4px; border: 1px solid #444; cursor: pointer; transition: 0.3s; }
    .payment-img:hover { border-color: #C9A45C; transform: scale(1.05); }
    .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .status-pending { background: #FFC107; color: #000; }
    .status-approved { background: #4CAF50; color: #fff; }
    .status-rejected { background: #F44336; color: #fff; }
    .actions { display: flex; gap: 10px; }
    .btn-approve { background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-reject { background: #F44336; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    /* --- FORM STYLING --- */
    .admin-form { background: #121212; padding: 30px; border-radius: 8px; border: 1px solid #292929; max-width: 600px; margin-bottom: 30px; }
    .admin-form label { display: block; color: #E4C98A; margin-bottom: 10px; font-weight: bold; font-size: 0.9rem; }
    .admin-form input, .admin-form select, .admin-form textarea { width: 100%; padding: 12px; background: #080808; color: white; border: 1px solid #444; border-radius: 4px; margin-bottom: 20px; box-sizing: border-box; font-family: inherit; }
    .admin-form input:focus, .admin-form select:focus, .admin-form textarea:focus { outline: none; border-color: #C9A45C; }

    @media (max-width: 768px) {
      .dash-shell { flex-direction: column; }
      .dash-side { width: 100%; border-right: none; border-bottom: 1px solid #292929; flex-direction: row; overflow-x: auto; padding: 0; }
      .dash-side a { padding: 15px; white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; }
      .dash-side a.active { border-left: none; border-bottom: 3px solid #C9A45C; }
      .dash-main { padding: 20px; }
    }
  </style>
</head>
<body class="dashboard">

  <!-- SECURE LOGIN GATE -->
  <div id="loginGate" class="login-gate">
    <div class="login-card">
      <h1>Admin Portal</h1>
      <p>Enter your administrative passcode.</p>
      
      <form id="adminLoginForm">
        <label>Administrative Passcode</label>
        <!-- type="tel" and inputmode="numeric" force the iPhone number pad -->
        <input type="tel" id="adminPasscode" placeholder="••••" inputmode="numeric" pattern="[0-9]*" maxlength="4" required autocomplete="off" />
        
        <button type="submit" class="btn btn-gold" id="loginBtn">UNLOCK DASHBOARD</button>
        <p id="loginError" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboardScreen" style="display: none;" class="dash-shell">
    <aside class="dash-side">
      <button id="tabBtnPayments" class="active" onclick="showTab('payments')">Payment Approvals</button>
      <button id="tabBtnContent" onclick="showTab('content')">Manage Content</button>
      <a href="../public/index.html" target="_blank">View Live Site</a>
      <button id="logoutBtn" style="margin-top: auto; color: #F44336; border-top: 1px solid #292929;">Lock Portal</button>
    </aside>
    
    <main class="dash-main">
      
      <!-- TAB: PAYMENTS -->
      <div id="tab-payments">
        <h1>Pending Payment Verifications</h1>
        <div id="paymentsContainer"><p style="color: #B8B8B8;">Loading secure data...</p></div>
      </div>

      <!-- TAB: CONTENT MANAGEMENT -->
      <div id="tab-content" style="display: none;">
        <h1>Manage Website Content</h1>
        <form id="contentForm" class="admin-form">
          <label>Select Content Type</label>
          <select id="contentType">
            <option value="advertisements">Advertisement (Banner)</option>
            <option value="gallery">Gallery Image</option>
            <option value="news">News Article</option>
            <option value="events">Event</option>
            <option value="opportunities">Casting Opportunity</option>
          </select>

          <label>Title / Headline</label>
          <input type="text" id="cTitle" placeholder="e.g., New Sound Stage" required>
          
          <label>Description</label>
          <textarea id="cDesc" placeholder="Brief description or excerpt..." style="height: 100px;"></textarea>
          
          <label>Upload Image (Optional)</label>
          <input type="file" id="cImage" accept="image/*">
          
          <button type="submit" class="btn btn-gold" style="width:100%;" id="publishBtn">PUBLISH TO WEBSITE</button>
        </form>
      </div>

    </main>
  </div>

  <script>
    const API_BASE = '/api';
    let authToken = localStorage.getItem('tp_admin_token');
    const loginGate = document.getElementById('loginGate');
    const dashboardScreen = document.getElementById('dashboardScreen');

    // Check session on load
    if (authToken) {
      verifySession(authToken);
    }

    // Handle Passcode Login
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      const passcode = document.getElementById('adminPasscode').value;
      
      btn.textContent = 'VERIFYING...';
      btn.disabled = true;
      err.style.display = 'none';

      try {
        // Sends the passcode as the password
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email: 'admin@tylerperry.com', 
            password: passcode 
          })
        });
        
        const data = await res.json();
        
        if (res.ok && data.user.role === 'admin') {
          localStorage.setItem('tp_admin_token', data.token);
          authToken = data.token;
          
          loginGate.style.display = 'none';
          dashboardScreen.style.display = 'flex';
          loadPayments();
        } else {
          throw new Error('Access denied. Incorrect passcode.');
        }
      } catch (error) {
        err.textContent = error.message;
        err.style.display = 'block';
        btn.textContent = 'UNLOCK DASHBOARD';
        btn.disabled = false;
        document.getElementById('adminPasscode').value = '';
      }
    });

    async function verifySession(token) {
      try {
        const res = await fetch(`${API_BASE}/admin/payments`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          loginGate.style.display = 'none';
          dashboardScreen.style.display = 'flex';
          loadPayments();
        } else {
          throw new Error('Expired');
        }
      } catch (e) {
        localStorage.removeItem('tp_admin_token');
        authToken = null;
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('tp_admin_token');
      window.location.reload();
    });

    function showTab(tab) {
      document.getElementById('tab-payments').style.display = tab === 'payments' ? 'block' : 'none';
      document.getElementById('tab-content').style.display = tab === 'content' ? 'block' : 'none';
      
      document.getElementById('tabBtnPayments').classList.remove('active');
      document.getElementById('tabBtnContent').classList.remove('active');
      
      if(tab === 'payments') document.getElementById('tabBtnPayments').classList.add('active');
      if(tab === 'content') document.getElementById('tabBtnContent').classList.add('active');
    }

    async function loadPayments() {
      const container = document.getElementById('paymentsContainer');
      try {
        const res = await fetch(`${API_BASE}/admin/payments`, { headers: { 'Authorization': `Bearer ${authToken}` } });
        const payments = await res.json();
        
        if (payments.length === 0) {
          container.innerHTML = '<p style="color: #B8B8B8;">No payments pending review.</p>';
          return;
        }

        container.innerHTML = payments.map(p => `
          <div class="payment-card">
            <div class="payment-info">
              <h3>${p.order_id} - $${p.amount}</h3>
              <p>User: ${p.full_name} (${p.email})</p>
              <p>Method: ${p.method}</p>
              <span class="status-badge status-${p.status}">${p.status.toUpperCase()}</span>
            </div>
            <div><img src="${p.proof_image_path}" class="payment-img" onclick="window.open(this.src)"></div>
            <div class="actions">
              ${p.status === 'pending' ? `
                <button class="btn-approve" onclick="processPay(${p.id}, 'approve')">APPROVE</button>
                <button class="btn-reject" onclick="processPay(${p.id}, 'reject')">REJECT</button>
              ` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="color: #F44336;">Error loading payment data.</p>';
      }
    }

    async function processPay(id, action) {
      if (!confirm(`Are you sure you want to ${action} this payment?`)) return;
      await fetch(`${API_BASE}/admin/payments/${id}/${action}`, { method: 'POST', headers: { 'Authorization': `Bearer ${authToken}` } });
      loadPayments();
    }

    document.getElementById('contentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('publishBtn');
      btn.textContent = 'PUBLISHING...';
      btn.disabled = true;

      const type = document.getElementById('contentType').value;
      const formData = new FormData();
      formData.append('title', document.getElementById('cTitle').value);
      formData.append('description', document.getElementById('cDesc').value);
      
      const file = document.getElementById('cImage').files[0];
      if (file) formData.append('image', file);

      try {
        const res = await fetch(`${API_BASE}/admin/${type}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` },
          body: formData
        });
        if (res.ok) {
          alert('Content published successfully!');
          document.getElementById('contentForm').reset();
        } else {
          alert('Upload failed');
        }
      } catch (err) { alert('Server error'); }
      finally {
        btn.textContent = 'PUBLISH TO WEBSITE';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
