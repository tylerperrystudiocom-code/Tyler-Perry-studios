<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tyler Perry — Application Received</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --bg: #080808; --bg-2: #121212; --gold: #C9A45C; --gold-2: #E4C98A; --text: #FFFFFF; --text-2: #B8B8B8; --border: #292929; --font-display: 'Cormorant Garamond', serif; --font-body: 'Inter', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.6; }
    ::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
    
    .site-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(8, 8, 8, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 1000; }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 75px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-mark { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; color: var(--gold); }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em; line-height: 1.1; }
    .logo-sub { font-size: 0.6rem; letter-spacing: 0.4em; color: var(--gold-2); }
    .nav-links { display: flex; align-items: center; gap: 10px; }
    .nav-links a { font-size: 0.75rem; text-transform: uppercase; color: var(--text-2); }

    .section { padding: 120px 20px 60px; max-width: 800px; margin: 0 auto; text-align: center; }
    
    .success-icon { font-size: 4rem; color: #4CAF50; margin-bottom: 20px; }
    h1 { font-family: var(--font-display); font-size: 3rem; margin-bottom: 10px; }
    p.subtitle { color: var(--text-2); margin-bottom: 40px; font-size: 1.1rem; }

    /* Profile Card */
    .profile-card { background: var(--bg-2); border: 1px solid var(--gold); border-radius: 12px; padding: 40px; text-align: left; box-shadow: 0 20px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; }
    
    .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    
    .info-grid { width: 100%; display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
    .info-item { background: #080808; padding: 15px; border-radius: 8px; border: 1px solid #292929; }
    .info-label { display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--gold); letter-spacing: 1px; margin-bottom: 5px; }
    .info-value { font-size: 1.1rem; font-weight: 600; color: white; }

    .btn-home { display: inline-block; margin-top: 40px; padding: 15px 40px; background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #080808; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
    .btn-home:hover { filter: brightness(1.1); transform: translateY(-2px); }

    @media (min-width: 600px) {
      .info-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html">
        <span class="logo-mark">T</span>
        <span class="logo-text">
          <span class="logo-title">TYLER PERRY</span>
          <span class="logo-sub">STUDIOS</span>
        </span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="success-icon">✓</div>
    <h1>Application Received</h1>
    <p class="subtitle">Thank you. Your audition application has been successfully submitted and reviewed.</p>

    <!-- PROFILE DISPLAY -->
    <div class="profile-card">
      <img id="displaySelfie" src="" alt="Applicant Selfie" class="profile-img">
      
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Full Legal Name</span>
          <div class="info-value" id="displayName">Loading...</div>
        </div>
        <div class="info-item">
          <span class="info-label">SSN Number</span>
          <div class="info-value" id="displaySSN">Loading...</div>
        </div>
        <div class="info-item" style="grid-column: 1 / -1;">
          <span class="info-label">Full Address</span>
          <div class="info-value" id="displayAddress">Loading...</div>
        </div>
      </div>
    </div>

    <a href="index.html" class="btn-home">Return to Homepage</a>
  </main>

  <script>
    // Retrieve the data saved from the previous page
    document.getElementById('displayName').textContent = sessionStorage.getItem('applicantName') || 'N/A';
    document.getElementById('displayAddress').textContent = sessionStorage.getItem('applicantAddress') || 'N/A';
    document.getElementById('displaySSN').textContent = sessionStorage.getItem('applicantSSN') || 'N/A';
    
    const selfieData = sessionStorage.getItem('applicantSelfie');
    if (selfieData) {
      document.getElementById('displaySelfie').src = selfieData;
    }
  </script>
</body>
</html>
