<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tyler Perry — Contact</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="brand-mark">TP</span><span class="brand-name">TYLER PERRY</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="auditions.html">Auditions</a>
        <a href="empowerment.html">Empowerment</a>
        <a href="membership.html">Membership</a>
        <a href="events.html">Events</a>
        <a href="gallery.html">Gallery</a>
        <a href="news.html">News</a>
        <a href="contact.html" class="active">Contact</a>
        <a class="btn-login" href="login.html" id="authBtn">Login</a>
      </nav>
    </div>
  </header>
  <main class="section container">
    <h1 class="section-title">Contact Us</h1>
    <form style="max-width: 500px;">
      <label style="display:block; margin-bottom:10px; color:var(--text-2);">Name<input type="text" style="width:100%; padding:10px; margin-top:5px; background:#0d0d0d; border:1px solid var(--border); color:white;"></label>
      <label style="display:block; margin-bottom:10px; color:var(--text-2);">Email<input type="email" style="width:100%; padding:10px; margin-top:5px; background:#0d0d0d; border:1px solid var(--border); color:white;"></label>
      <label style="display:block; margin-bottom:10px; color:var(--text-2);">Message<textarea style="width:100%; padding:10px; margin-top:5px; background:#0d0d0d; border:1px solid var(--border); color:white; height:100px;"></textarea></label>
      <button type="button" class="btn btn-gold">SEND MESSAGE</button>
    </form>
  </main>
  <footer class="site-footer"><div class="container footer-bottom"><p>&copy; <span data-year></span> Tyler Perry Platform. All rights reserved.</p></div></footer>
  <script src="js/main.js"></script>
</body>
