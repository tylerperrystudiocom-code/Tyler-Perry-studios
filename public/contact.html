<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tyler Perry — Contact Us</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --bg: #080808; 
      --bg-2: #121212; 
      --gold: #C9A45C; 
      --gold-2: #E4C98A; 
      --text: #FFFFFF; 
      --text-2: #B8B8B8; 
      --border: #292929; 
      --font-display: 'Cormorant Garamond', serif; 
      --font-body: 'Inter', sans-serif; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: var(--font-body); 
      line-height: 1.6; 
      background-image: linear-gradient(rgba(8, 8, 8, 0.85), rgba(8, 8, 8, 0.95)), url('https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    ::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
    
    .site-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(8, 8, 8, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 1000; }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 75px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-mark { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; color: var(--gold); }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em; line-height: 1.1; }
    .logo-sub { font-size: 0.6rem; letter-spacing: 0.4em; color: var(--gold-2); }
    .nav-links { display: flex; align-items: center; gap: 10px; }
    .nav-links a { font-size: 0.75rem; text-transform: uppercase; color: var(--text-2); transition: 0.3s; }
    .nav-links a.active, .nav-links a:hover { color: var(--gold-2); }

    .section { padding: 140px 20px 60px; max-width: 700px; margin: 0 auto; }
    
    h1 { 
      font-family: var(--font-display); 
      font-size: 3rem; 
      margin-bottom: 30px; 
      color: var(--gold-2);
      text-align: center;
    }

    .contact-form { 
      background: rgba(18, 18, 18, 0.85); 
      border: 1px solid rgba(201, 164, 92, 0.3); 
      backdrop-filter: blur(10px);
      padding: 40px; 
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .form-group { margin-bottom: 25px; }
    .form-group label { 
      display: block; 
      color: var(--gold-2); 
      font-size: 0.85rem; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 10px; 
    }
    
    .form-group input, .form-group textarea { 
      width: 100%; 
      padding: 16px; 
      background: #080808; 
      border: 1px solid #444; 
      border-radius: 4px; 
      color: white; 
      font-family: var(--font-body); 
      font-size: 1rem; 
      transition: 0.3s; 
    }
    
    .form-group input:focus, .form-group textarea:focus { 
      outline: none; 
      border-color: var(--gold); 
      box-shadow: 0 0 10px rgba(201, 164, 92, 0.2);
    }

    .btn-submit { 
      width: 100%;
      padding: 16px; 
      background: linear-gradient(135deg, var(--gold), var(--gold-2)); 
      color: #080808; 
      border: none; 
      border-radius: 4px; 
      font-weight: 700; 
      font-size: 0.9rem; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      cursor: pointer; 
      transition: 0.3s; 
    }
    .btn-submit:hover { filter: brightness(1.1); transform: translateY(-2px); }

    .site-footer { border-top: 1px solid var(--border); padding: 30px 20px; text-align: center; color: var(--text-2); font-size: 0.85rem; margin-top: 40px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html">
        <span class="logo-mark">T</span>
        <span class="logo-text">
          <span class="logo-title">TYLER PERRY</span>
          <span class="logo-sub">STUDIOS</span>
        </span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="contact.html" class="active">Contact</a>
        <a class="btn-login" href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <h1>Contact Us</h1>
    
    <!-- The form now uses FormSubmit to send emails directly to you -->
    <form class="contact-form" action="https://formsubmit.co/tylerperrystudioff@gmail.com" method="POST">
      
      <!-- FormSubmit Configuration -->
      <input type="hidden" name="_subject" value="New Message from Tyler Perry Website">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email address" required>
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea name="message" rows="5" placeholder="Type your message here..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Send Message</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; Tyler Perry Platform. All rights reserved.</p>
  </footer>

</body>
</html>
