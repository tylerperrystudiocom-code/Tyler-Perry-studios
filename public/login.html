<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tyler Perry — Login</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --bg: #080808; --bg-2: #121212; --gold: #C9A45C; --gold-2: #E4C98A; --text: #FFFFFF; --text-2: #B8B8B8; --border: #292929; --font-display: 'Cormorant Garamond', serif; --font-body: 'Inter', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.6; }
    ::-webkit-scrollbar { display: none; }
    a { text-decoration: none; color: inherit; }
    
    .site-header { position: fixed; top: 0; left: 0; right: 0; background: rgba(8, 8, 8, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 1000; }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 75px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-mark { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; color: var(--gold); }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; letter-spacing: 0.2em; line-height: 1.1; }
    .logo-sub { font-size: 0.6rem; letter-spacing: 0.4em; color: var(--gold-2); }
    .nav-links { display: flex; align-items: center; gap: 10px; }
    .nav-links a { font-size: 0.75rem; text-transform: uppercase; color: var(--text-2); transition: 0.3s; }

    .login-container { max-width: 400px; margin: 120px auto 60px; background: var(--bg-2); padding: 40px; border: 1px solid var(--gold); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    h1 { font-family: var(--font-display); font-size: 2.2rem; text-align: center; color: var(--gold-2); margin-bottom: 10px; }
    p.subtitle { text-align: center; color: var(--text-2); font-size: 0.9rem; margin-bottom: 30px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--gold-2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 14px; background: #080808; border: 1px solid #444; border-radius: 4px; color: white; font-family: var(--font-body); font-size: 1rem; transition: 0.3s; }
    .form-group input:focus { outline: none; border-color: var(--gold); }
    
    .btn-submit { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #080808; border: none; border-radius: 4px; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
    .btn-submit:hover { filter: brightness(1.1); transform: translateY(-2px); }
    
    .error-msg { color: #F44336; font-size: 0.85rem; text-align: center; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html">
        <span class="logo-mark">T</span>
        <span class="logo-text">
          <span class="logo-title">TYLER PERRY</span>
          <span class="logo-sub">STUDIOS</span>
        </span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="login-container">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in with your email and passcode to view your portal.</p>
    
    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="john@gmail.com" required>
      </div>
      
      <!-- PASSCODE BOX ADDED HERE -->
      <div class="form-group">
        <label>Passcode</label>
        <input type="tel" id="passcode" placeholder="Enter your 4-digit passcode" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
      </div>
      
      <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
    </form>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('errorMsg');
      const email = document.getElementById('email').value;
      const passcode = document.getElementById('passcode').value;
      
      btn.textContent = 'Verifying...';
      btn.disabled = true;
      err.style.display = 'none';

      try {
        // Uses the new user-login route
        const res = await fetch('/api/auth/user-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, passcode })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          // Save the session
          const userSession = {
            fullName: data.user.name,
            email: data.user.email,
            selfie: data.user.selfie
          };
          
          localStorage.setItem('tp_current_user', JSON.stringify(userSession));
          window.location.href = 'user-dashboard.html';
        } else {
          throw new Error(data.error || 'Invalid email or passcode');
        }
      } catch (error) {
        err.textContent = error.message;
        err.style.display = 'block';
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
